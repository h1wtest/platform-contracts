syntax = "proto3";

package identity.v1;

import "google/protobuf/timestamp.proto";

option go_package = "platform-contracts/gen/go/identity/v1;identityv1";

service IdentityService {
  // ValidateToken verifies an access token and returns user claims/permissions
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);

  // CheckPermission checks whether a user has a specific granular permission
  rpc CheckPermission (CheckPermissionRequest) returns (CheckPermissionResponse);

  // GetUserSessions returns all active sessions for a given user
  rpc GetUserSessions (GetUserSessionsRequest) returns (GetUserSessionsResponse);

  // RevokeSession terminates a specific user session
  rpc RevokeSession (RevokeSessionRequest) returns (RevokeSessionResponse);

  // RevokeAllSessions terminates all active sessions for a given user
  rpc RevokeAllSessions (RevokeAllSessionsRequest) returns (RevokeAllSessionsResponse);

  // BanUser bans a user and revokes all active sessions immediately
  rpc BanUser (BanUserRequest) returns (BanUserResponse);
}

// -------------------------------------------------------------
// Token Validation
// -------------------------------------------------------------
message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool is_valid = 1;
  string user_id = 2;
  string session_id = 3;
  repeated string roles = 4;
  repeated string permissions = 5;
  google.protobuf.Timestamp expires_at = 6;
  string error_message = 7;
}

// -------------------------------------------------------------
// Granular Permission Check (Policy Enforcement Point)
// -------------------------------------------------------------
message CheckPermissionRequest {
  string user_id = 1;
  string permission = 2;                         // e.g. "aws:ec2:reboot", "users:ban"
}

message CheckPermissionResponse {
  bool allowed = 1;
  string reason = 2;
}

// -------------------------------------------------------------
// Active Sessions
// -------------------------------------------------------------
message SessionItem {
  string session_id = 1;
  string ip_address = 2;
  string user_agent = 3;
  string device_name = 4;
  string location = 5;
  bool is_current = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp last_active_at = 8;
}

message GetUserSessionsRequest {
  string user_id = 1;
  string current_session_id = 2;                 // Optional: mark is_current
}

message GetUserSessionsResponse {
  repeated SessionItem sessions = 1;
}

// -------------------------------------------------------------
// Revocation
// -------------------------------------------------------------
message RevokeSessionRequest {
  string user_id = 1;
  string session_id = 2;
  string reason = 3;
}

message RevokeSessionResponse {
  bool success = 1;
}

message RevokeAllSessionsRequest {
  string user_id = 1;
  string reason = 2;
}

message RevokeAllSessionsResponse {
  bool success = 1;
  uint32 revoked_count = 2;
}

// -------------------------------------------------------------
// Ban User
// -------------------------------------------------------------
message BanUserRequest {
  string user_id = 1;
  string reason = 2;
  string banned_by = 3;                          // Admin user ID
}

message BanUserResponse {
  bool success = 1;
}
