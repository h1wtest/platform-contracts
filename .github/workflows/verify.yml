name: contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: go1.26.10
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan tracked history for secrets
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - name: Regenerate and reject stale DTOs
        run: |
          python3 scripts/generate.py
          git diff --exit-code -- gen/go/events/types.go rust/src/types.rs gen/go/internalhttp/types.go rust/src/http.rs
      - name: Check v1 compatibility against trusted predecessor
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check_revision_compatibility.py "$EVENT_NAME" "$BASE_SHA"
      - name: Behavioral contract tests and builds
        run: |
          go test ./...
          go build ./...
          cargo test --locked --manifest-path rust/Cargo.toml
          cargo build --locked --manifest-path rust/Cargo.toml
          python3 -m unittest discover -s tests
      - name: Dependency vulnerability scans
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
          cargo install cargo-audit --version 0.22.0 --locked
          cargo audit --file rust/Cargo.lock
      - name: Build immutable schema artifact without publishing
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "platform-contracts:$GITHUB_SHA" .
